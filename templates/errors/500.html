{% extends "base.html" %}
{% block title %}Something Went Wrong{% endblock %}

{% block content %}
<section class="section section--cream">
  <div class="container result-state">
    <div class="big-icon err"><svg aria-hidden="true"><use href="#i-wrench"></use></svg></div>
    <h1>Something Went Wrong</h1>
    <p>Sorry, an unexpected error occurred. Please try again, or contact us for assistance.</p>
    <div class="actions">
      <a class="btn btn--gold" href="{% url 'home' %}">Back to Home</a>
      <a class="btn btn--whatsapp" href="{{ whatsapp_link }}" target="_blank" rel="noopener">
        <svg class="ico" width="18" height="18" aria-hidden="true"><use href="#i-whatsapp"></use></svg> WhatsApp Us
      </a>
    </div>
  </div>
</section>
{% endblock %}
