{% extends "base.html" %}
{% block title %}Page Not Found{% endblock %}

{% block content %}
<section class="section section--cream">
  <div class="container result-state">
    <div class="big-icon err" style="background:var(--gold-soft);color:var(--gold)"><span style="font-size:30px;font-weight:800">404</span></div>
    <h1>Page Not Found</h1>
    <p>The page you're looking for doesn't exist or has moved. Let's get you back on track.</p>
    <div class="actions">
      <a class="btn btn--gold" href="{% url 'home' %}">Back to Home</a>
      <a class="btn btn--whatsapp" href="{{ whatsapp_link }}" target="_blank" rel="noopener">
        <svg class="ico" width="18" height="18" aria-hidden="true"><use href="#i-whatsapp"></use></svg> WhatsApp Us
      </a>
    </div>
  </div>
</section>
{% endblock %}
